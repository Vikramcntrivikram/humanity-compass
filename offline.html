<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanity Compass - Offline</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #212529;
            text-align: center;
            padding: 2rem;
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.7;
        }
        h1 {
            color: #2563eb;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        a:hover {
            background-color: #1d4ed8;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #e0e0e0;
            }
            h1 {
                color: #60a5fa;
            }
            a {
                background-color: #60a5fa;
            }
            a:hover {
                background-color: #3b82f6;
            }
        }
    </style>
</head>
<body>
    <div class="offline-icon">📴</div>
    <h1>You're Offline</h1>
    <p>Humanity Compass is designed to work offline, but it looks like you've lost your connection.</p>
    <p>You can still explore previously loaded content, but some features may be limited until you're back online.</p>
    <a href="#" onclick="window.location.reload(); return false;">Try Again</a>
</body>
</html>
